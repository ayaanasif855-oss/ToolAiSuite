<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolAISuite - 100% Private Browser-Based PDF Tools Suite</title>
    <meta name="description" content="Free, 100% private online PDF tools. Merge, split, compress, convert, rotate, OCR, watermark and unlock PDFs entirely in your browser. Zero server uploads." />
    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Baseline Schema.org JSON-LD Structured Data -->
    <script id="json-ld-structured-data" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://toolaisuite.com/#organization",
          "name": "ToolAISuite",
          "url": "https://toolaisuite.com",
          "email": "ayaanasif855@gmail.com",
          "description": "Provider of 100% client-side browser-native PDF and document utilities with zero server file uploads."
        },
        {
          "@type": "WebSite",
          "@id": "https://toolaisuite.com/#website",
          "url": "https://toolaisuite.com",
          "name": "ToolAISuite",
          "description": "Free, fast, and 100% client-side PDF tools with zero server storage.",
          "publisher": {
            "@id": "https://toolaisuite.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://toolaisuite.com/#/all-tools?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('toolaisuite_theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
